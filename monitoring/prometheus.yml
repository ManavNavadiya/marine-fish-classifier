global:
  scrape_interval: 5s       # how often Prometheus pulls /metrics
  evaluation_interval: 5s

scrape_configs:
  - job_name: marine-fish-classifier
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:80"]   # the app container, via the host

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
