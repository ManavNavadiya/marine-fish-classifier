name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/manavnavadiya/marine-fish-classifier

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-serve.txt

      - name: Install dependencies
        run: pip install -r requirements-serve.txt pytest==8.3.2 httpx==0.27.0

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Build, smoke-test, publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: marine-fish-classifier:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8000:8000 marine-fish-classifier:ci

          # Wait up to 60 s for the model to load
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/health | grep -q '"model_loaded":true' && break
            sleep 2
          done
          curl -fs http://127.0.0.1:8000/health | grep -q '"model_loaded":true'

          # Real prediction: a typical clownfish
          curl -fsS -H "Content-Type: application/json" \
            -d '{"length_cm":9,"weight_kg":0.02,"height_cm":4,"fin_count":7,"water_temp_c":26}' \
            http://127.0.0.1:8000/predict | tee prediction.json
          echo
          grep -q '"species":"Clownfish"' prediction.json

          # Error handling: non-JSON must be rejected with 415
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Content-Type: text/plain" -d "hello" http://127.0.0.1:8000/predict)
          echo "Non-JSON request returned $status"
          test "$status" = "415"

          # Error handling: impossible values must be rejected with 400
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Content-Type: application/json" \
            -d '{"length_cm":9,"weight_kg":-1,"height_cm":4,"fin_count":7,"water_temp_c":26}' http://127.0.0.1:8000/predict)
          echo "Out-of-range request returned $status"
          test "$status" = "400"

          # Frontend is served
          curl -fs http://127.0.0.1:8000/ | grep -q "<form"

      - name: Container logs on failure
        if: failure()
        run: docker logs smoke || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_PUBLIC_IP: ${{ vars.EC2_PUBLIC_IP }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha

      - name: Deploy on EC2 via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --parameters "{\"commands\":[\"/usr/local/bin/deploy-app.sh ${GITHUB_SHA}\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # Poll until the deploy script on the server finishes (max 5 min)
          STATUS=Pending
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $STATUS"
          test "$STATUS" = "Success"

      - name: Verify public endpoint
        run: |
          curl -fsS "http://$EC2_PUBLIC_IP/health" | tee health.json
          grep -q '"model_loaded":true' health.json
